name: CloudPhysics
description: 'CloudPhysics is a SaaS-based big-data analytics platform for virtualized
  IT infrastructure, founded in 2011 and acquired by Hewlett Packard Enterprise in
  2021. Deployed as the CloudPhysics Observer virtual appliance against VMware vSphere
  / vCenter, it collects IT metadata and delivers data-driven insights for capacity
  planning, cost optimization, migration assessment, and infrastructure health. It
  is now part of HPE; cloudphysics.com redirects to HPE storage. CloudPhysics exposes
  no public developer API of its own — the product consumes the VMware vCenter API
  to gather metadata rather than publishing a developer-facing API, so this profile
  carries identity and domain-security signal only.'
